name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-2022
            preset: windows-ci
          - name: Ubuntu
            os: ubuntu-latest
            preset: linux-ci

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libibus-1.0-dev \
            libjpeg-dev \
            libpng-dev \
            libpulse-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload tested Release package
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-${{ matrix.name }}
          path: out/build/${{ matrix.preset }}/tests/package-artifact/Release/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload SDK distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.name }}
          path: |
            out/build/${{ matrix.preset }}/distribution/Release/nomad-sdk-*.zip
            out/build/${{ matrix.preset }}/distribution/Release/SHA256SUMS.txt
            tests/DistributionSmokeTest.cmake
            tests/TestProcess.cmake
          if-no-files-found: error
          retention-days: 7

      - name: Upload graphical acceptance game
        uses: actions/upload-artifact@v4
        with:
          name: graphical-package-${{ matrix.name }}
          path: out/build/${{ matrix.preset }}/tests/package-graphical-artifact/Release/*
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    name: ${{ matrix.name }} isolated package
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            preset: windows-ci
          - name: Ubuntu
            os: ubuntu-latest
            preset: linux-ci
    steps:
      - name: Download tested Release package
        uses: actions/download-artifact@v4
        with:
          name: package-smoke-${{ matrix.name }}
          path: package-smoke

      - name: Extract and start without a source checkout or build
        run: cmake -P package-smoke/PackageSmokeTest.cmake

      - name: Download SDK distribution
        uses: actions/download-artifact@v4
        with:
          name: distribution-${{ matrix.name }}
          path: distribution-smoke

      - name: Check SDK without a source checkout or build
        run: cmake -DNOMAD_DISTRIBUTION_OUTPUT=distribution-smoke/out/build/${{ matrix.preset }}/distribution/Release -P distribution-smoke/tests/DistributionSmokeTest.cmake

  documentation:
    name: Build documentation
    needs: package-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download tested Linux SDK
        uses: actions/download-artifact@v4
        with:
          name: distribution-Ubuntu
          path: documentation-sdk

      - name: Extract verified SDK
        shell: bash
        run: |
          set -euo pipefail
          distribution="$PWD/documentation-sdk/out/build/linux-ci/distribution/Release"
          sdk="$PWD/out/documentation/sdk"
          cd "$distribution"
          sha256sum --check --strict SHA256SUMS.txt
          archives=(nomad-sdk-*.zip)
          test "${#archives[@]}" -eq 1
          mkdir -p "$sdk"
          unzip -q "${archives[0]}" -d "$sdk"
          cd "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build site
        run: |
          python -m unittest discover -s scripts -p "test_*.py"
          python scripts/generate_documentation.py --sdk out/documentation/sdk
          python -m pip install -r docs/requirements.txt
          python -m mkdocs build --strict

      - name: Upload validated site
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: out/documentation/site
          if-no-files-found: error
          retention-days: 7
